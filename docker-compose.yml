services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayuda
      POSTGRES_PASSWORD: ayuda
      POSTGRES_DB: ayudaporcolombia
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis: bus de Pub/Sub para el adapter de WebSockets del chat en tiempo real.
  # Permite que el broadcast de novedades funcione al escalar el backend a varios
  # procesos/contenedores. En dev se expone en :6379 para poder inspeccionarlo.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
