server {
    listen 80;

    # Resolver DNS interno de Docker (127.0.0.11). Usamos variables en
    # proxy_pass para que nginx resuelva `back` en CADA petición, no al arrancar:
    # si el backend no está listo aún o se reinicia, nginx NO crashea con
    # "host not found in upstream" y simplemente reintenta en la siguiente
    # petición. Sin esto, nginx muere en bucle al arrancar antes que el back.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA (React Router): sirve estáticos y hace fallback a index.html para que
    # el cliente enrute rutas como /crear, /p/:code, /moderador.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API → backend NestJS. Same-origin: el navegador no ve CORS para /api.
    # Usamos el container_name `apc-back` (no el service name): es el nombre
    # que SIEMPRE resuelve Docker en la red, sin depender de aliases de service.
    location /api/ {
        set $backend http://apc-back:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Permite cuerpos grandes (FormData/JSON con base64 si llegara).
        client_max_body_size 15m;
    }

    # Fotos en modo LOCAL (dev): el backend las sirve desde /uploads/.
    # En producción (STORAGE_DRIVER=seaweedfs) las fotos vienen de cdn.jffsolutions.com
    # y este path no se usa; el proxy queda por compatibilidad.
    location /uploads/ {
        set $backend http://apc-back:4000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}

