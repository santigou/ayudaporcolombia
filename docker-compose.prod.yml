# Despliegue de producción: 2 contenedores (front + back) + Postgres + Cloudflare Tunnel.
#
# Uso:
#   1) cp .env.prod.example .env.prod  y completa JWT_SECRET, TUNNEL_TOKEN, SEED_MODERATOR_*, POSTGRES_PASSWORD, S3_SECRET_KEY
#   2) En Cloudflare Zero Trust crea un Tunnel (con nombre), copia su token en TUNNEL_TOKEN
#      y añade un Public Hostname (ej. ayuda.tudominio.com) -> servicio "http://front:80".
#   3) docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: apc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayuda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-ayudaporcolombia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Accesible desde la red local (LAN): otros equipos se conectan con un
    # cliente SQL a <ip-del-servidor>:5434 (user=POSTGRES_USER, db=POSTGRES_DB).
    # Para restringir a SOLO este host (localhost), cambia a "127.0.0.1:5434:5432".
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayuda} -d ${POSTGRES_DB:-ayudaporcolombia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend NestJS: API pura (/api). No sirve estáticos en producción.
  back:
    build:
      context: .
      dockerfile: Dockerfile
      target: back
    container_name: apc-back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayuda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ayudaporcolombia}?schema=public
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env.prod}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      SEED_MODERATOR_EMAIL: ${SEED_MODERATOR_EMAIL:-}
      SEED_MODERATOR_PASSWORD: ${SEED_MODERATOR_PASSWORD:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-seaweedfs}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://cdn.jffsolutions.com}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ayudaporcolombia}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://cdn.jffsolutions.com}
    # Puerto expuesto SOLO en localhost (127.0.0.1): útil para probar la API
    # directamente desde el host en local y en el servidor. No queda accesible
    # desde internet (el tunnel expone la app al público vía el `front`).
    ports:
      - "127.0.0.1:4000:4000"

  # Frontend nginx: sirve el SPA y hace proxy de /api y /uploads al back.
  front:
    build:
      context: .
      dockerfile: Dockerfile
      target: front
    container_name: apc-front
    restart: unless-stopped
    depends_on:
      - back
    # Puerto expuesto SOLO en localhost (127.0.0.1): el SPA queda en
    # http://localhost:8081 para probar. En el servidor el público llega por tunnel.
    ports:
      - "127.0.0.1:8081:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: apc-tunnel
    restart: unless-stopped
    depends_on:
      - front
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?define TUNNEL_TOKEN en .env.prod}

volumes:
  pgdata: