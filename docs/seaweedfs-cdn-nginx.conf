# =============================================================================
# Config de nginx para SeaweedFS — IDÉNTICA a la original del contenedor
# j4f-cdn-proxy. NO añade CORS aquí: SeaweedFS lo maneja de forma nativa a
# nivel de bucket (put-bucket-cors), igual que AWS S3, incluyendo el preflight
# OPTIONS del navegador.
#
#   - Subida (PUT): el navegador recibe del backend una URL pre-firmada de AWS
#     (la firma va en query params, vence en 5 min).
#   - Lectura (GET): el bucket "ayudaporcolombia" es público de lectura.
#   - CORS: se aplica al bucket con `aws s3api put-bucket-cors`
#     (ver docs/seaweedfs-s3-config.md). No toques este nginx.
#
# Este archivo se deja solo como referencia; si tu nginx ya proxies a
# seaweedfs:8333 y seaweedfs:8888, NO necesitas cambiarlo.
# =============================================================================

# S3 API - cdn.jffsolutions.com
server {
    listen 80;
    server_name cdn.jffsolutions.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://seaweedfs:8333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Para large uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Filer UI - storage-ui.jffsolutions.com
server {
    listen 80;
    server_name storage-ui.jffsolutions.com;

    location / {
        proxy_pass http://seaweedfs:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


